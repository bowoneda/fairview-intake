# Fast checks on every push and pull request. Needs no secrets and touches no hosted service.
# The live suites (isolation, integration, browser) are in live-suites.yml and run on demand.
# Results here are builder evidence only; a phase closes only through the Master Vetting sub-agent (CLAUDE.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history, so the push check can scan every commit

      # PUSH-CHECKLIST.md, automated: secrets, personal data, forbidden paths, oversized files, and the
      # genericization check from RULES.md. First the files as they are, then every line in the history,
      # since a public repository publishes its history too.
      - name: Push check, current files
        run: bash scripts/push-check.sh
      - name: Push check, whole history
        run: bash scripts/push-check.sh --history --all

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      # The build inlines the two public Supabase values. Placeholders are enough to prove the app compiles; the
      # real values are only needed by the live suites.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
